services:
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: sellora
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sellora_dev_pass}
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellora -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sellora-network

networks:
  sellora-network:
    driver: bridge

volumes:
  order-db-data:
