name: CD - Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Azure production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="${DOCKERHUB_USERNAME}/sellora-order"

          docker build \
            -t "${IMAGE}:${IMAGE_SHA}" \
            -t "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${IMAGE_SHA}"
          docker push "${IMAGE}:latest"

      - name: Wait for Azure to pull and deploy new image
        run: |
          echo "Waiting 90s for Azure Deployment Center to pull the new :latest image..."
          sleep 90

      - name: Validate deployed production startup
        shell: bash
        env:
          BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail

          HEALTH_URL="${BASE_URL}/health"
          WHOAMI_URL="${BASE_URL}/whoami"

          for attempt in {1..20}; do
            HEALTH_STATUS=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$HEALTH_URL" || true)

            WHOAMI_STATUS=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$WHOAMI_URL" || true)

            if [ "$HEALTH_STATUS" = "200" ] && { [ "$WHOAMI_STATUS" = "200" ] || [ "$WHOAMI_STATUS" = "401" ]; }; then
              echo "Production startup validation passed: /health=200 and /whoami responded with ${WHOAMI_STATUS}"
              exit 0
            fi

            echo "Attempt $attempt -> /health=${HEALTH_STATUS}, /whoami=${WHOAMI_STATUS}"
            sleep 15
          done

          echo "Production deployment validation failed: app did not start with expected runtime configuration"
          exit 1
